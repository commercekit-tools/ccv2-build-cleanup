# Unreleased registry-backed cleanup notification integration.
# Both action pins are immutable; review their validation before adoption.
# This workflow remains dry-run and does not authorize real deletion.
name: Preview and notify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ccv2-cleanup-${{ vars.CCV2_SUBSCRIPTION_CODE }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: commercekit-tools/ccv2-build-cleanup@d7363059d4ef523a40e8df912c03ee1215200224
        id: cleanup
        with:
          token-endpoint: ${{ secrets.CCV2_TOKEN_ENDPOINT }}
          client-id: ${{ secrets.CCV2_CLIENT_ID }}
          client-secret: ${{ secrets.CCV2_CLIENT_SECRET }}
          resource: ${{ secrets.CCV2_RESOURCE }}
          subscription-code: ${{ vars.CCV2_SUBSCRIPTION_CODE }}
          dry-run: "true"
      - uses: commercekit-tools/notify@832f6bd04b1889d0d3b4d47a1b2dc0e110985c73
        if: ${{ always() && steps.cleanup.outputs.notification-event != '' }}
        with:
          provider: slack # or teams-workflow
          event-json: ${{ steps.cleanup.outputs.notification-event }}
          webhook-url: ${{ secrets.CLEANUP_NOTIFICATION_WEBHOOK }}
          fail-on-notification-error: "false"
