# Candidate integration only: published notification-contract 0.0.3 and current
# Notify cannot emit/render cleanup. Apply reviewed additive patches and publish
# separately, then replace BOTH SHA placeholders with validated compatible commits.
name: Preview and notify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ccv2-cleanup-${{ vars.CCV2_SUBSCRIPTION_CODE }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: commercekit-tools/ccv2-build-cleanup@REPLACE_WITH_REVIEWED_40_CHARACTER_COMMIT_SHA
        id: cleanup
        with:
          token-endpoint: ${{ secrets.CCV2_TOKEN_ENDPOINT }}
          client-id: ${{ secrets.CCV2_CLIENT_ID }}
          client-secret: ${{ secrets.CCV2_CLIENT_SECRET }}
          resource: ${{ secrets.CCV2_RESOURCE }}
          subscription-code: ${{ vars.CCV2_SUBSCRIPTION_CODE }}
          dry-run: "true"
      - uses: commercekit-tools/notify@REPLACE_WITH_COMPATIBLE_NOTIFY_40_CHARACTER_COMMIT_SHA
        if: ${{ always() && steps.cleanup.outputs.notification-event != '' }}
        with:
          provider: slack # or teams-workflow
          event-json: ${{ steps.cleanup.outputs.notification-event }}
          webhook-url: ${{ secrets.CLEANUP_NOTIFICATION_WEBHOOK }}
          fail-on-notification-error: "false"
